<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solo Leveling System HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-color: #040209;
            --panel-bg: rgba(10, 8, 26, 0.88);
            --border-cyan: #00f0ff;
            --border-purple: #9d4edd;
            --text-color: #e2f1ff;
            --accent-glow: #00f0ff;
            --purple-glow: #7b2cbf;
            --accent-red: #ff2a6d;
            --accent-gold: #ffbe0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 95px;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(123, 44, 191, 0.25), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15), transparent 50%),
                linear-gradient(to bottom, #040209, #090514);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Lightning Canvas Background */
        #lightning-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* Fixed Navigation Bar at Bottom */
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(8, 5, 20, 0.95);
            border-top: 2px solid var(--border-cyan);
            box-shadow: 0 -5px 25px rgba(0, 240, 255, 0.3), inset 0 2px 10px rgba(157, 78, 221, 0.4);
            padding: 10px 0;
            z-index: 9999;
            backdrop-filter: blur(12px);
        }

        .tab-btn {
            background: none;
            border: none;
            color: #6c7a9c;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 33%;
            user-select: none;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--border-cyan);
            text-shadow: 0 0 12px var(--border-cyan), 0 0 20px var(--purple-glow);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
            position: relative;
            z-index: 2;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Solo Leveling Authentic Window Panel */
        .system-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-cyan);
            box-shadow: 
                0 0 20px rgba(0, 240, 255, 0.2), 
                0 0 40px rgba(123, 44, 191, 0.15),
                inset 0 0 15px rgba(0, 240, 255, 0.08);
            border-radius: 4px;
            padding: 18px;
            margin-bottom: 18px;
            position: relative;
        }

        /* Ornamental Anime Frame Corners */
        .system-panel::before, .system-panel::after {
            content: '';
            position: absolute;
